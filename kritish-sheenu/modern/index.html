<style>/* ───────── Kritish & Sheenu · Pichwai invitation (mobile) ───────── */
:root{
  --W:min(100vw,480px);
  --paper:#FCF8EF; --ink:#4A2F26; --soft:#7A5E50; --line:rgba(122,94,80,.25);
  --hi:"Amita", "Tiro Devanagari Hindi", serif; --deva:"Tiro Devanagari Hindi", serif;
  --display:"Gloock", Georgia, serif; --serif:"EB Garamond", Georgia, serif;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--serif);font-size:18px;line-height:1.5;color:var(--ink);
  background:linear-gradient(180deg,#CFE3F1 0,#EEF1EC 26%,#F6EBDD 60%,#F7DEC8 100%) fixed;overflow-x:hidden}
body.locked{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
p{margin:0}
h1,h2,h3{margin:0;font-weight:400}
a{color:inherit}
:focus-visible{outline:2px solid var(--c,#8E2F3F);outline-offset:3px;border-radius:3px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.site{max-width:480px;margin:0 auto;padding:68px 14px 0}
main{display:flex;flex-direction:column;gap:var(--s6)}

/* reveal */
.reveal{opacity:0;transform:translateY(24px);transition:opacity .9s ease,transform 1s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}}

/* ═════ Pichwai card ═════ */
.pcard{position:relative;background:var(--c);padding:12px;border-radius:6px;box-shadow:0 18px 36px -24px rgba(60,30,20,.55)}
.pcard::before{content:"";position:absolute;inset:5px;border:1px solid rgba(255,255,255,.35);border-radius:4px;pointer-events:none}
.pc-paper{position:relative;background:var(--paper);border-radius:2px;overflow:hidden;padding-top:92px}
.pc-arch{position:absolute;top:-1px;left:-1px;width:calc(100% + 2px);height:92px;fill:var(--c);z-index:1}
.pc-corner{position:absolute;top:2px;width:86px;height:86px;z-index:2;background:rgba(255,255,255,.42);
  -webkit-mask:url(art/corner-line.webp) no-repeat 0 0/contain;mask:url(art/corner-line.webp) no-repeat 0 0/contain}
.pc-corner.l{left:2px}.pc-corner.r{right:2px;transform:scaleX(-1)}
.hangings{position:absolute;inset:0 0 auto;height:200px;z-index:3;pointer-events:none}
.hg{position:absolute;top:44px;height:auto;transform-origin:50% 0;animation:sway 5s ease-in-out infinite}
.hg.m1{left:14%;width:8px}.hg.l1{left:22%;width:13px;top:30px;animation-delay:-1.2s}
.hg.m2{left:31%;width:7px;top:18px;animation-delay:-2s}
.hg.m3{right:31%;width:7px;top:18px;animation-delay:-.6s}.hg.l2{right:22%;width:13px;top:30px;animation-delay:-2.4s}
.hg.m4{right:14%;width:8px;animation-delay:-1.6s}
@keyframes sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
.pc-body{position:relative;z-index:4;padding:28px 26px var(--s5);display:flex;flex-direction:column;align-items:center;text-align:center}
.pc-art{position:relative;display:block;width:100%;height:auto;margin-top:-28px;
  -webkit-mask:linear-gradient(transparent 0,#000 30%);mask:linear-gradient(transparent 0,#000 30%)}

/* ═════ type system ═════ */
.label{font-family:var(--serif);font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--soft);line-height:1.6}
.pcard .label{color:var(--ink)}
.pc-body > .label:first-child{color:var(--c)}
.hi{font-family:var(--deva);color:var(--c)}
.hi-title{font-family:var(--hi);font-weight:700;font-size:38px;line-height:1.35;color:var(--c);margin-top:var(--s1)}
.hi-title.sm{font-size:28px}
.title{font-family:var(--display);font-size:22px;line-height:1.25;color:var(--ink);letter-spacing:.01em;margin-top:var(--s1)}
.when{font-family:var(--display);font-size:17px;color:var(--ink);margin-top:var(--s3)}
.time{font-family:var(--serif);font-size:17px;color:var(--soft);margin-top:2px}
.venue{font-family:var(--display);font-size:17px;line-height:1.3;color:var(--ink)}
.addr{font-size:15px;font-style:italic;color:var(--soft);margin-top:2px;line-height:1.4}
.msg{font-size:17px;font-style:italic;line-height:1.55;margin-top:var(--s4);color:var(--ink);max-width:30ch}
.meta{font-size:15px;color:var(--soft);line-height:1.5;margin-top:var(--s2)}
.quote{font-size:18px;font-style:italic;line-height:1.6;color:var(--ink);margin-top:var(--s3);max-width:32ch}
.note{font-size:13px;font-style:italic;color:var(--soft);margin-top:var(--s2)}
.note.ph{font-style:normal;color:#8A3A1E;background:#FFF1D6;border:1px dashed #D9A35C;padding:3px 8px;border-radius:4px}
.lotus-rule{display:flex;align-items:center;justify-content:center;gap:var(--s3);width:100%;max-width:230px;margin:var(--s4) auto}
.lotus-rule i{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--c),transparent);opacity:.6}
.lotus-rule img{height:34px;width:auto}

/* buttons */
.btn-line,.btn-solid{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 22px;border-radius:999px;
  font-family:var(--serif);font-size:13px;letter-spacing:.2em;text-transform:uppercase;text-decoration:none;margin-top:var(--s4);transition:.2s}
.btn-line{border:1px solid var(--c);color:var(--c);background:transparent}
.btn-line:hover{background:var(--c);color:#fff}
.btn-solid{border:0;background:var(--c);color:#fff;box-shadow:0 0 0 3px var(--paper),0 0 0 4px var(--c)}
.link{background:none;border:0;color:var(--c);text-decoration:underline;font-size:15px;margin-top:var(--s3)}

/* ═════ main invitation ═════ */
.pc-main .pc-body{padding-top:0}
.inv-logo{width:150px;margin:-40px auto var(--s2)}
.inv-logo .logo{display:block;width:100%;height:auto}
.invocation{font-size:14px;line-height:1.7}
.greeting{font-size:20px;margin-top:var(--s2)}
.lead{font-size:16px;font-style:italic;color:var(--soft);margin-top:var(--s2);max-width:28ch}
.person{display:flex;flex-direction:column;align-items:center;margin-top:var(--s4)}
.person .hi-title{font-size:32px;margin:0}
.person .name{font-family:var(--display);font-size:24px;line-height:1.2;color:var(--ink)}
.person .meta{margin-top:var(--s1);font-style:italic}
.weds{font-family:var(--hi);font-weight:700;font-size:22px;color:#B4864A;margin-top:var(--s4)}

/* story */
.cities{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:var(--s3);width:100%;margin-top:var(--s5)}
.cities > span{color:var(--c);padding-top:4px}
.cities h3{font-family:var(--display);font-size:18px}
.cities p{font-size:14px;color:var(--soft);line-height:1.4;margin-top:2px}

/* countdown */
.cd-units{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s2);width:100%}
.cd-unit{display:flex;flex-direction:column;align-items:center;padding:var(--s3) 0 var(--s2);border:1px solid var(--line);border-radius:44px 44px 6px 6px;background:#fff}
.cd-unit .num{font-family:var(--display);font-size:28px;line-height:1.1;color:var(--c);font-variant-numeric:tabular-nums}
.cd-unit .lab{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);margin-top:2px}
.cd-past{font-family:var(--display);font-size:16px;letter-spacing:.08em;color:var(--c)}

/* celebrations */
.celebrations{display:flex;flex-direction:column;gap:var(--s6)}
.sec-title{text-align:center;padding:var(--s3) var(--s4) 0}
.sec-title .hi-title{color:#8E2F3F}
.sec-title .title{font-size:26px}
.sec-title .meta{max-width:30ch;margin:var(--s2) auto 0}
.day{display:flex;flex-direction:column;gap:var(--s5)}
.day-head{display:flex;align-items:center;justify-content:center;gap:var(--s4);text-align:center}
.day-head img{height:56px;width:auto}
.day-head .hi{font-family:var(--hi);font-weight:700;font-size:24px;color:#8E2F3F;line-height:1.3}
.day-head .label{color:var(--ink)}
.rituals{width:100%;margin-top:var(--s5);padding-top:var(--s4);border-top:1px solid var(--line)}
.ritual{padding:var(--s3) 0;border-bottom:1px dashed var(--line)}
.ritual:last-child{border-bottom:0}
.r-name{font-family:var(--display);font-size:17px;line-height:1.3;color:var(--ink)}
.ritual.main .r-name{color:var(--c)}
.r-time{font-size:14.5px;color:var(--soft);margin-top:2px}
.pc-event .hi-title{color:var(--ink)}

/* gallery */
.g-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2);width:100%}
.g-item{position:relative;display:block;padding:0;border:0;background:none;aspect-ratio:1;overflow:hidden;border-radius:2px;box-shadow:0 0 0 1px var(--line)}
.g-item.g0{grid-column:span 2;aspect-ratio:16/10;border-radius:80px 80px 2px 2px}
.g-item img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 1s}
.g-item:hover img{transform:scale(1.05)}
.g-item span{position:absolute;left:0;right:0;bottom:0;padding:18px 6px 6px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#fff;background:linear-gradient(transparent,rgba(40,20,20,.55))}
.lightbox{position:fixed;inset:0;z-index:80;background:rgba(40,22,26,.94);display:flex;align-items:center;justify-content:center;padding:60px 14px 90px;animation:fade .3s}
.lb-stage{width:min(460px,100%);animation:lbIn .45s cubic-bezier(.2,.7,.2,1)}
.lb-stage img{display:block;width:100%;max-height:70vh;object-fit:contain;background:var(--paper);padding:8px;border-radius:2px}
.lb-cap{color:#F7E7D2;text-align:center;font-size:12px;letter-spacing:.2em;text-transform:uppercase;margin-top:var(--s3)}
.lb-cap span{opacity:.6;margin-left:8px}
.lb-btn{position:absolute;width:44px;height:44px;border-radius:50%;border:1px solid rgba(247,231,210,.5);background:rgba(255,255,255,.08);color:#F7E7D2;display:flex;align-items:center;justify-content:center}
.lb-close{top:14px;right:14px}.lb-prev{bottom:22px;left:calc(50% - 56px)}.lb-next{bottom:22px;right:calc(50% - 56px)}
@keyframes fade{from{opacity:0}}
@keyframes lbIn{from{opacity:0;transform:scale(.95)}}

/* blessings + rsvp */
.family{width:100%;display:flex;flex-direction:column;align-items:center;gap:2px}
.family p:not(.label){font-size:16px;line-height:1.45;margin-bottom:var(--s3);max-width:30ch}
.family .hi{font-size:17px;margin-bottom:0}
.rsvp{width:100%;display:flex;flex-direction:column;align-items:stretch;gap:var(--s3);margin-top:var(--s4);text-align:left}

.rsvp label em{text-transform:none;letter-spacing:0;font-size:13px;color:var(--soft)}
.rsvp input:not([type=radio]),.rsvp textarea{font-family:var(--serif);font-size:17px;letter-spacing:0;text-transform:none;padding:11px 14px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);width:100%}
.rsvp input:focus,.rsvp textarea:focus{outline:2px solid var(--c);outline-offset:1px}
.rsvp fieldset{border:1px solid var(--line);border-radius:6px;padding:var(--s2) var(--s4) var(--s3);margin:0}
.rsvp legend{font-size:12px;letter-spacing:.16em;text-transform:uppercase;padding:0 6px}
.rsvp label.radio{flex-direction:row;align-items:center;gap:10px;font-size:17px;letter-spacing:0;text-transform:none;padding:6px 0}
.rsvp label.radio input{width:18px;height:18px;accent-color:var(--c)}
.rsvp .btn-solid,.rsvp .btn-line{align-self:center}
.rsvp .meta{text-align:center}
.rsvp pre{white-space:pre-wrap;font-family:var(--serif);font-size:16px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:var(--s3);margin:0}
.rsvp .label{text-align:center}
.form-err{background:#FFF1D6;color:#7A2E1E;padding:8px 12px;border-radius:6px;font-size:15px}
.contact{margin-top:var(--s3)}
.phones{display:flex;gap:var(--s4);justify-content:center;margin-top:4px}
.phones a{font-size:16px;color:var(--c);text-decoration:none;letter-spacing:.04em}
.dir{display:flex;flex-wrap:wrap;gap:var(--s2);justify-content:center}
.dir .btn-line{margin-top:var(--s3)}
.baraat-note{margin-top:var(--s5);max-width:30ch}

/* nav */
.nav{position:fixed;top:0;left:50%;transform:translateX(-50%);width:var(--W);z-index:40;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;transition:background .3s,box-shadow .3s}
.nav.scrolled,.nav.menu-open{background:rgba(252,248,239,.94);box-shadow:0 1px 0 var(--line);backdrop-filter:blur(6px)}
.nav-brand{display:flex;align-items:baseline;gap:2px;background:none;border:0;padding:0;line-height:1}
.nav-brand .ka{font-family:var(--deva);font-size:30px;color:#6F9A47}
.nav-brand .s{font-family:"Playfair Display",serif;font-size:28px;color:#E57AA0;margin-left:-4px}
.nav-toggle{background:none;border:0;width:44px;height:44px;position:relative}
.nav-toggle i{position:absolute;left:11px;right:11px;height:1.5px;background:var(--ink);transition:.3s}
.nav-toggle i:nth-of-type(1){top:15px}.nav-toggle i:nth-of-type(2){top:21px}.nav-toggle i:nth-of-type(3){top:27px}
.menu-open .nav-toggle i:nth-of-type(1){top:21px;transform:rotate(45deg)}
.menu-open .nav-toggle i:nth-of-type(2){opacity:0}
.menu-open .nav-toggle i:nth-of-type(3){top:21px;transform:rotate(-45deg)}
.nav-links{position:absolute;top:100%;left:0;right:0;display:flex;flex-direction:column;background:rgba(252,248,239,.98);padding:var(--s2) var(--s5) var(--s4);box-shadow:0 10px 20px -12px rgba(60,30,20,.4);opacity:0;transform:translateY(-6px);pointer-events:none;transition:.25s}
.menu-open .nav-links{opacity:1;transform:none;pointer-events:auto}
.nav-links button{background:none;border:0;border-bottom:1px solid var(--line);text-align:left;padding:12px 0;font-size:13px;letter-spacing:.2em;text-transform:uppercase}

/* footer */
.footer{text-align:center;padding:var(--s7) 0 var(--s6)}
.footer .logo{width:150px;height:auto;display:block;margin:0 auto}
.footer p{font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--soft);margin-top:var(--s3)}

/* ═════ intro ═════ */
.intro{position:fixed;top:0;bottom:0;left:50%;width:var(--W);transform:translateX(-50%);z-index:60;overflow:hidden}
.intro-logo{position:absolute;inset:0;z-index:3;border:0;padding:0;background:linear-gradient(180deg,#9CCBEB,#EEF2EE 55%,#F8DCC3);display:flex;align-items:center;justify-content:center;transition:opacity 1s,visibility 1s;cursor:pointer}
.intro-logo .logo{width:92%;max-height:100%;height:auto;animation:logoIn 2s cubic-bezier(.2,.7,.2,1) both}
@keyframes logoIn{from{opacity:0;transform:scale(.94)}}
.intro:not(.stage-logo) .intro-logo{opacity:0;visibility:hidden}
.door-stage{position:absolute;inset:0;z-index:2;transition:transform 1s cubic-bezier(.5,0,.3,1),opacity .9s}
.door-box{position:absolute;left:50%;top:50%;width:max(100%,calc(100vh * 1080 / 2340));aspect-ratio:1080/2340;transform:translate(-50%,-50%);perspective:1500px}
.door-frame{position:absolute;inset:0;width:100%;height:100%;z-index:2}
.door-leaf{position:absolute;top:29.487%;height:49.402%;width:27.037%;z-index:1;transition:transform 1.6s cubic-bezier(.55,.05,.3,1)}
.door-leaf img{display:block;width:100%;height:100%}
.door-leaf.left{left:22.963%;transform-origin:left center}
.door-leaf.right{left:50%;transform-origin:right center}
.stage-opening .door-leaf.left,.stage-leaving .door-leaf.left{transform:rotateY(-104deg)}
.stage-opening .door-leaf.right,.stage-leaving .door-leaf.right{transform:rotateY(104deg)}
.stage-leaving .door-stage{transform:scale(2.2);opacity:0}
.diya-glow{position:absolute;z-index:3;top:77.5%;width:16%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,214,120,.55),rgba(255,214,120,0) 65%);animation:glow 2.4s ease-in-out infinite;pointer-events:none}
.diya-glow.l{left:27.6%}.diya-glow.r{left:73.4%;animation-delay:-1.1s}
@keyframes glow{0%,100%{opacity:.6}50%{opacity:1}}
.door-cta{position:absolute;left:0;right:0;bottom:max(3vh,16px);z-index:4;text-align:center;transition:opacity .4s}
.door-cta .hi{display:table;margin-left:auto;margin-right:auto;font-family:var(--hi);font-weight:700;font-size:19px;color:#6B2A2E;margin-bottom:var(--s3);padding:2px 16px;border-radius:999px;background:rgba(252,243,226,.92)}
.btn-open{min-height:48px;padding:0 30px;border:0;border-radius:999px;background:#8E2F3F;color:#FCEFD9;font-family:var(--serif);font-size:13px;letter-spacing:.24em;text-transform:uppercase;box-shadow:0 0 0 3px #F6E6CC,0 0 0 4px #8E2F3F,0 10px 24px rgba(90,30,30,.3)}
.stage-opening .door-cta,.stage-leaving .door-cta{opacity:0}
@media (prefers-reduced-motion:reduce){.door-leaf,.door-stage{transition:opacity .3s}.stage-opening .door-leaf{opacity:0;transform:none}.hg,.diya-glow{animation:none}}

/* ═════ landing (Chittorgarh) ═════ */
.site{padding-top:0}
.hero{position:relative;height:100svh;min-height:560px;margin:0 -14px 32px;overflow:hidden;display:flex;flex-direction:column;align-items:center}
.hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 100%;transform-origin:50% 100%}
.site.shown .hero-img{animation:heroIn 2.6s cubic-bezier(.2,.7,.2,1) both}
@keyframes heroIn{from{transform:scale(1.08)}}
.hero-veil{position:absolute;inset:0 0 auto;height:50%;background:linear-gradient(rgba(244,244,238,.92) 0,rgba(244,244,238,.8) 62%,rgba(244,244,238,0))}
.hero-text{position:relative;z-index:2;padding:max(9vh,70px) 24px 0;text-align:center;display:flex;flex-direction:column;align-items:center}
.site.shown .hero-text{animation:fadeUp 1.4s .3s both}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}}
.hero-names{display:flex;flex-direction:column;align-items:center;font-family:var(--display);font-size:clamp(42px,12.5vw,54px);line-height:1.02;margin-top:var(--s2)}
.hero-names .g{color:#5E8A3A}.hero-names .p{color:#D9638F}
.hero-names .amp{font-family:"Playfair Display",serif;font-style:italic;font-size:.5em;color:#B4864A;margin:2px 0}
.hero-union{font-family:var(--serif);font-size:15px;letter-spacing:.42em;text-transform:uppercase;color:#6B2A2E;margin-top:var(--s4);padding-left:.42em}
.hero-tag{font-family:var(--serif);font-style:italic;font-size:18px;color:var(--ink);margin-top:var(--s2)}
.hero-date{font-family:var(--display);font-size:15px;color:#6B2A2E;margin-top:var(--s2);letter-spacing:.04em}
.scroll-cue{position:absolute;bottom:max(3vh,18px);left:50%;transform:translateX(-50%);z-index:2;width:28px;height:42px;border:1.5px solid rgba(255,255,255,.9);border-radius:14px;background:rgba(60,40,30,.15)}
.scroll-cue span{position:absolute;left:50%;top:8px;width:3px;height:8px;margin-left:-1.5px;border-radius:2px;background:#fff;animation:cue 1.8s ease-in-out infinite}
@keyframes cue{0%{opacity:0;transform:translateY(0)}40%{opacity:1}100%{opacity:0;transform:translateY(12px)}}
.nav:not(.scrolled):not(.menu-open) .nav-toggle i{background:#4A2F26}

/* concept typography */
.title.lg{font-size:26px}
.ev-theme{font-family:var(--display);font-size:27px;line-height:1.2;color:var(--ink);margin-top:var(--s1)}
.pc-event .hi-title.sm{color:var(--c);font-size:26px}
.pc-main .title{font-size:24px;color:var(--c)}

/* gallery with 3 photos */
.g-grid{grid-template-columns:1fr 1fr}
.g-item.g0{grid-column:span 2;aspect-ratio:4/5;border-radius:120px 120px 2px 2px}
.g-item.g1,.g-item.g2{aspect-ratio:3/4}

/* ═════ v6 landing: logo + names on the sky, fort below ═════ */
.hero{height:auto;min-height:100svh;display:flex;flex-direction:column;background:linear-gradient(180deg,#C8D9E1 0,#DCE0E0 40%,#F0DAD4 100%)}
.hero-sky{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;text-align:center;padding:62px 24px 6px}
.hero-logo{width:104px}
.hero-logo .logo{display:block;width:100%;height:auto}
.hero-sky .label{margin-top:var(--s2);color:#6B4A3D}
.hero-names{position:relative;display:flex;flex-direction:column;align-items:center;font-family:"Bodoni Moda",serif;font-weight:500;font-size:clamp(46px,13.5vw,58px);line-height:1;margin-top:var(--s3);letter-spacing:-.01em}
.hero-names .ini{font-family:"Cinzel Decorative",serif;font-size:1.12em;margin-right:-.02em}
.hero-names .g{color:#4F7A30}.hero-names .p{color:#C9507F}
.hero-names .amp{font-family:"Bodoni Moda",serif;font-style:italic;font-size:.46em;color:#B4864A;margin:6px 0 4px}
.spark{position:absolute;fill:#FFFDF6;filter:drop-shadow(0 0 4px rgba(255,255,255,.9));animation:twinkle 2.6s ease-in-out infinite}
.spark.s1{width:18px;top:-10px;left:-22px}.spark.s2{width:12px;top:42%;right:-24px;animation-delay:-1s}.spark.s3{width:14px;bottom:-6px;left:10%;animation-delay:-1.8s}
@keyframes twinkle{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}
.hero-union{margin-top:var(--s4)}
.hero-img{position:relative;inset:auto;display:block;width:100%;height:auto;object-fit:initial;margin-top:-6%;
  -webkit-mask:linear-gradient(transparent 0,#000 12%);mask:linear-gradient(transparent 0,#000 12%)}
.site.shown .hero-img{animation:fortUp 2.2s cubic-bezier(.2,.7,.2,1) both}
@keyframes fortUp{from{opacity:0;transform:translateY(40px)}}
.hero-veil{display:none}
.scroll-cue{position:absolute;bottom:22px}

/* falling petals */
.petals{position:fixed;top:0;bottom:0;left:50%;width:var(--W);transform:translateX(-50%);pointer-events:none;z-index:30;overflow:hidden;animation:fade 1.2s}
.petals img{position:absolute;top:-60px;height:auto;opacity:.92;animation:petal linear infinite;will-change:transform}
@keyframes petal{0%{transform:translate3d(0,-8vh,0) rotate(0)}50%{transform:translate3d(var(--drift),52vh,0) rotate(calc(var(--spin) / 2))}100%{transform:translate3d(calc(var(--drift) * -.5),112vh,0) rotate(var(--spin))}}

@keyframes eq{0%,100%{height:4px}50%{height:16px}}

/* share + credit */
.share{display:flex;flex-wrap:wrap;gap:var(--s2);justify-content:center;margin-top:var(--s5)}
.btn-share{display:inline-flex;align-items:center;min-height:44px;padding:0 20px;border-radius:999px;border:0;background:#8E2F3F;color:#fff;font-family:var(--serif);font-size:12.5px;letter-spacing:.18em;text-transform:uppercase;text-decoration:none}
.btn-share.ghost{background:transparent;color:#8E2F3F;box-shadow:inset 0 0 0 1px #8E2F3F}

/* ═════════════ MODERN DECOR EDITION ═════════════ */
body{background:#F4ECE2}
.site{background:#FBF7F1;box-shadow:0 0 50px rgba(80,50,30,.12);padding:0}
main{gap:0}

.rule b{font-size:12px;font-weight:400}
.quote{font-size:19px;font-style:italic;line-height:1.6;max-width:30ch;color:#3E2A22}
.meta{color:#7A6458}
.btn-line{border-color:var(--deep);color:var(--deep)}
.btn-line:hover{background:var(--deep);color:#fff}
.hi{font-family:var(--hi);font-weight:700;color:var(--deep)}

/* landing */
.hero{position:relative;min-height:100svh;display:flex;flex-direction:column;background:linear-gradient(180deg,#D3C7C9 0,#E2CDC4 45%,#E6D0C3 100%);overflow:hidden}

/* call it badge */
